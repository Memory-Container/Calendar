                        <div class="nav-section">
                            <div>
                                <h3>Tổng Quan</h3>
                                <hr>
                                <div class="overview">
                                    <table>
                                        <tr>
                                            <td>Đã hoàn thành</td>
                                            <td class="count completed">1</td>
                                        </tr>
                                        <tr>
                                            <td>Đang hoàn thành</td>
                                            <td class="count in-progress">1</td>
                                        </tr>
                                        <tr>
                                            <td>Bị hủy</td>
                                            <td class="count canceled">0</td>
                                        </tr>
                                    </table>
                                </div>
                            </div>
                            <div>
                                <h3>Hiển thị</h3>
                                <hr>
                                <div style="display: flex; flex-direction: column; gap: 5px">
                                    <label class="flex-r">
                                        <input type="checkbox" checked>
                                        Đã hoàn thành
                                    </label>
                                    <label class="flex-r">
                                        <input type="checkbox" checked>
                                        Đang hoàn thành
                                    </label>
                                    <label class="flex-r">
                                        <input type="checkbox" checked>
                                        Bị hủy
                                    </label>
                                </div>
                            </div>
                            <div>
                                <h3>Thời gian hiển thị</h3>
                                <hr>
                                <div style="display: flex; flex-direction: column; gap: 5px">
                                    <label class="flex-r">
                                        <input class="display-mode" type="radio" name="display-mode" id="3days">
                                        Trong 3 ngày
                                    </label>
                                    <label class="flex-r">
                                        <input class="display-mode" type="radio" name="display-mode" id="week">
                                        Trong tuần
                                    </label>
                                    <label class="flex-r">
                                        <input class="display-mode" type="radio" name="display-mode" id="month" checked>
                                        Trong tháng
                                    </label>
                                    <label class="flex-r">
                                        <input class="display-mode" type="radio" name="display-mode" id="all" checked>
                                        Tất cả
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>
                </aside>
            </div>
        </section>
    </main>
