<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
        background: #eee;
        display: flex;
        justify-content: center;
        padding: 40px;
        }

        .timeline {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        }
        /* Vertical line */
        .timeline::before {
        content: "";
        position: absolute;
        left: 50%;
        top: 0;
        width: 2px;
        height: 100%;
        background: #bbb;
        transform: translateX(-50%);
        }

        /* Nodes */
        .node {
        position: relative;
        width: 14px;
        height: 14px;
        border: 2px solid #bbb;
        border-radius: 50%;
        background: white;
        margin: 40px auto;
        z-index: 1;
        }
        .node span {
        position: absolute;
        left: 25px;
        top: -3px;
        font-size: 12px;
        }
        /* Active (bigger/darker circles) */
        .node.active {
        width: 18px;
        height: 18px;
        border: 3px solid #666;
        }
    </style>
</head>
<body onload="location.href = './pages/test/index.html'">
</body>
</html>
